<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>ปืนยิงบาร์โค้ด</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#FFC400">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  :root {
    --yellow: #FFC400;
    --dark: #1c1c1e;
    --green: #34c759;
    --red: #ff4d4f;
    --radius: 22px;
  }
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--yellow);
    margin: 0;
    padding: 16px;
    padding-bottom: 40px;
    min-height: 100vh;
    overscroll-behavior: none;
  }
  h1 {
    color: #1c1c1e;
    font-size: 22px;
    font-weight: 800;
    text-align: center;
    margin: 6px 0 16px;
  }

  .card {
    background: var(--dark);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.15);
  }
  .card-light {
    background: #fff;
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 16px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.12);
    position: relative;
  }

  .config-label {
    color: var(--yellow);
    font-weight: 700;
    font-size: 15px;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .config-sub { color: #999; font-size: 13px; margin-bottom: 12px; }
  .config-row { display: flex; gap: 8px; }
  input {
    flex: 1;
    padding: 13px 14px;
    border-radius: 14px;
    border: none;
    background: #0f0f10;
    color: #eee;
    font-size: 14px;
    -webkit-user-select: text;
    user-select: text;
  }
  input::placeholder { color: #666; }
  button {
    border: none;
    border-radius: 14px;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
  }
  .btn-yellow { background: var(--yellow); color: #1c1c1e; padding: 13px 20px; white-space: nowrap; }

  #reader {
    width: 100%;
    border-radius: 16px;
    overflow: hidden;
    filter: brightness(0.55);
    transition: filter 0.15s;
  }
  #reader.active { filter: brightness(1); }

  .idle-overlay {
    position: absolute;
    top: 14px; left: 14px; right: 14px;
    text-align: center;
    color: #fff;
    font-weight: 700;
    font-size: 15px;
    pointer-events: none;
    text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    z-index: 6;
  }

  .laser-line {
    position: absolute;
    left: 14px;
    right: 14px;
    top: 50%;
    height: 2px;
    background: #666;
    box-shadow: 0 0 6px 1px rgba(0,0,0,0.3);
    transform: translateY(-50%);
    pointer-events: none;
    z-index: 6;
    transition: background 0.1s, box-shadow 0.1s;
  }
  .laser-line.live {
    background: #ff1a1a;
    box-shadow: 0 0 10px 3px rgba(255,26,26,0.9), 0 0 20px 6px rgba(255,26,26,0.4);
  }

  .status-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 10px;
    font-size: 14px;
    color: #555;
    font-weight: 600;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #ccc; }
  .dot.ok { background: var(--green); }
  .dot.live { background: var(--red); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  .result-card {
    background: var(--dark);
    border-radius: var(--radius);
    padding: 18px 22px;
    text-align: center;
    margin-bottom: 16px;
  }
  .result-label { color: #999; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .result-code { color: var(--green); font-size: 24px; font-weight: 800; word-break: break-all; min-height: 30px; }
  .result-count {
    margin-top: 10px;
    display: inline-block;
    background: #0f0f10;
    color: var(--yellow);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 700;
  }

  #trigger {
    width: 100%;
    padding: 22px;
    border-radius: 26px;
    background: var(--dark);
    color: var(--yellow);
    font-size: 19px;
    font-weight: 800;
    letter-spacing: 0.5px;
    box-shadow: 0 8px 0 #000, 0 10px 18px rgba(0,0,0,0.25);
    transform: translateY(0);
    transition: transform 0.08s, box-shadow 0.08s, background 0.08s;
  }
  #trigger.pressed {
    background: var(--green);
    color: #06210f;
    transform: translateY(6px);
    box-shadow: 0 2px 0 #000, 0 4px 10px rgba(0,0,0,0.25);
  }

  #gear {
    position: fixed;
    top: 14px; right: 16px;
    font-size: 20px;
    background: #1c1c1e;
    color: var(--yellow);
    width: 40px; height: 40px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    z-index: 10;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>

<button id="gear" onclick="showConfig()">⚙️</button>

<h1>🔫 ปืนยิงบาร์โค้ด</h1>

<div class="card" id="config">
  <div class="config-label">⚙️ ตั้งค่าลิงก์หลังบ้าน</div>
  <div class="config-sub">วาง Firebase Database URL ของคุณ:</div>
  <div class="config-row">
    <input type="text" id="dbUrl" placeholder="https://xxxx-default-rtdb...">
    <button class="btn-yellow" onclick="saveConfig()">บันทึก</button>
  </div>
</div>

<div class="card-light">
  <div id="reader"></div>
  <div class="laser-line" id="laserLine"></div>
  <div class="idle-overlay" id="idleOverlay">🔒 กดปุ่มด้านล่างค้างไว้ แล้วให้เส้นแดงพาดผ่านบาร์โค้ด</div>
  <div class="status-row">
    <div class="dot" id="statusDot"></div>
    <span id="status">กำลังเปิดกล้อง...</span>
  </div>
</div>

<div class="result-card">
  <div class="result-label">รหัสล่าสุดที่สแกนได้</div>
  <div class="result-code" id="last">—</div>
  <div class="result-count" id="count">ยังไม่มีการสแกน</div>
</div>

<button id="trigger">👉 กดค้างเพื่อสแกน</button>

<script>
let dbUrl = localStorage.getItem('dbUrl') || '';
document.getElementById('dbUrl').value = dbUrl;
let sentCount = 0;
let scanningEnabled = false; // จะเป็น true ตอนกดปุ่มค้างเท่านั้น

if (dbUrl) {
  document.getElementById('config').classList.add('hidden');
} else {
  document.getElementById('gear').classList.add('hidden');
}

function showConfig() {
  document.getElementById('config').classList.remove('hidden');
}

function saveConfig() {
  dbUrl = document.getElementById('dbUrl').value.trim().replace(/\/$/, '');
  localStorage.setItem('dbUrl', dbUrl);
  document.getElementById('status').innerText = 'บันทึกแล้ว';
  document.getElementById('config').classList.add('hidden');
  document.getElementById('gear').classList.remove('hidden');
}

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function beep() {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.frequency.value = 1200;
  gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.1);
}

async function sendToPC(code) {
  if (!dbUrl) {
    document.getElementById('status').innerText = 'ยังไม่ได้ใส่ Database URL';
    return;
  }
  const payload = { code: code, ts: Date.now() };
  try {
    const res = await fetch(dbUrl + '/scans.json', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    sentCount++;
    document.getElementById('count').innerText = 'ส่งไปแล้ว ' + sentCount + ' ครั้ง';
  } catch (e) {
    document.getElementById('status').innerText = 'ส่งไม่สำเร็จ: ' + e.message;
  }
}

const html5QrCode = new Html5Qrcode("reader");
const qrConfig = { fps: 12, qrbox: { width: 270, height: 50 } };

let lastCode = '';
let scannedThisPress = false; // สแกนไปแล้วในการกดครั้งนี้หรือยัง

function onScanSuccess(decodedText) {
  if (!scanningEnabled) return;
  if (scannedThisPress) return; // กดค้างอยู่แต่สแกนไปแล้ว 1 ชิ้น ไม่รับซ้ำจนกว่าจะปล่อยแล้วกดใหม่
  scannedThisPress = true;
  lastCode = decodedText;
  document.getElementById('last').innerText = decodedText;
  sendToPC(decodedText);
  beep();
  if (navigator.vibrate) navigator.vibrate(80);
}

let cameraReady = false;

html5QrCode.start(
  { facingMode: "environment" },
  qrConfig,
  onScanSuccess
).then(() => {
  cameraReady = true;
  html5QrCode.pause(true); // เริ่มต้นแบบหยุดไว้ก่อน รอกดปุ่ม
  document.getElementById('status').innerText = 'พร้อมใช้งาน — กดปุ่มด้านล่างค้างไว้';
  document.getElementById('statusDot').classList.add('ok');
}).catch(err => {
  document.getElementById('status').innerText = 'เปิดกล้องไม่ได้: ' + err;
});

function startScanning() {
  if (!cameraReady) return;
  scanningEnabled = true;
  scannedThisPress = false;
  try { html5QrCode.resume(); } catch (e) {}
  document.getElementById('reader').classList.add('active');
  document.getElementById('laserLine').classList.add('live');
  document.getElementById('idleOverlay').classList.add('hidden');
  document.getElementById('statusDot').classList.add('live');
  document.getElementById('status').innerText = 'กำลังสแกน...';
  document.getElementById('trigger').classList.add('pressed');
}

function stopScanning() {
  if (!cameraReady) return;
  scanningEnabled = false;
  try { html5QrCode.pause(true); } catch (e) {}
  document.getElementById('reader').classList.remove('active');
  document.getElementById('laserLine').classList.remove('live');
  document.getElementById('idleOverlay').classList.remove('hidden');
  document.getElementById('statusDot').classList.remove('live');
  document.getElementById('status').innerText = 'พร้อมใช้งาน — กดปุ่มด้านล่างค้างไว้';
  document.getElementById('trigger').classList.remove('pressed');
}

const trigger = document.getElementById('trigger');
trigger.addEventListener('touchstart', e => { e.preventDefault(); startScanning(); }, { passive: false });
trigger.addEventListener('touchend', e => { e.preventDefault(); stopScanning(); }, { passive: false });
trigger.addEventListener('touchcancel', e => { e.preventDefault(); stopScanning(); }, { passive: false });
trigger.addEventListener('mousedown', startScanning);
trigger.addEventListener('mouseup', stopScanning);
trigger.addEventListener('mouseleave', stopScanning);
</script>
</body>
</html>
